# =============================================================================
# ACME Global Payment Fraud Lakehouse - Dataplex Auto Data Quality Scan Spec
# Step 05 Production Config: dq_rules.yaml
#
# Target Table: projects/acme-l400-part3-eri-01/datasets/fraud_features_gold/tables/gold_fraud_features
# Scan ID: fraud-gold-dq-scan-dev
# Gate 1 Requirement: 100% Rule Pass Rate for CI/CD Promotion
# =============================================================================

scan_id: "fraud-gold-dq-scan-dev"
display_name: "ACME Gold Fraud Feature Mart Quality Gate"
description: "Dataplex Auto Data Quality verification scan for ACME Fraud Lakehouse Gold features"

target:
  project_id: "acme-l400-part3-eri-01"
  dataset_id: "fraud_features_gold"
  table_id: "gold_fraud_features"

sampling_percent: 100.0

rules:
  # Rule 1: Customer ID Completeness (Zero Nulls)
  - column: "customer_id"
    dimension: "COMPLETENESS"
    non_null_expectation: {}
    threshold: 1.0

  # Rule 2: Masked SSN Cryptographic SHA-256 Format
  - column: "masked_ssn"
    dimension: "CONFORMANCE"
    regex_expectation:
      regex: "^[0-9a-f]{64}$"
    threshold: 1.0

  # Rule 3: Masked Email Cryptographic SHA-256 Format
  - column: "masked_email"
    dimension: "CONFORMANCE"
    regex_expectation:
      regex: "^[0-9a-f]{64}$"
    threshold: 1.0

  # Rule 4: Loyalty Tier Completeness
  - column: "loyalty_tier"
    dimension: "COMPLETENESS"
    non_null_expectation: {}
    threshold: 1.0

  # Rule 5: Payment Method Domain Validity
  - column: "payment_method"
    dimension: "VALIDITY"
    set_expectation:
      values: ["0", "1", "2"]
    threshold: 1.0

  # Rule 6: Strictly Positive Transaction Spend
  - dimension: "INTEGRITY"
    sql_assertion:
      expression: "total_tx_amount > 0"
    threshold: 1.0

  # Rule 7: Strictly Positive Transaction Count
  - dimension: "INTEGRITY"
    sql_assertion:
      expression: "total_tx_count > 0"
    threshold: 1.0

  # Rule 8: Net Amount Bounded by Gross Amount
  - dimension: "CONSISTENCY"
    sql_assertion:
      expression: "total_net_amount <= total_tx_amount"
    threshold: 1.0

  # Rule 9: High-Risk Spend Bounded by Gross Amount
  - dimension: "CONSISTENCY"
    sql_assertion:
      expression: "high_risk_mcc_amount <= total_tx_amount"
    threshold: 1.0

  # Rule 10: Non-Negative Disputed Amount
  - dimension: "CONSISTENCY"
    sql_assertion:
      expression: "total_disputed_amount >= 0"
    threshold: 1.0

  # Rule 11: Non-Negative Geographic Distance
  - column: "max_geo_distance_km"
    dimension: "VALIDITY"
    range_expectation:
      min_value: "0.0"
    threshold: 1.0

  # Rule 12: Peak 1-Hour Velocity Range
  - column: "peak_velocity_1h"
    dimension: "VALIDITY"
    range_expectation:
      min_value: "1"
    threshold: 1.0
