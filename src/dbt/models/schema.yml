version: 2

sources:
  - name: acme_silver_dev
    database: acme-l400-part3-eri-01
    schema: fraud_detection_db
    tables:
      - name: payment_transactions_silver
      - name: customers_crm_silver
      - name: merchants_stores_silver
      - name: device_auth_logs_silver
      - name: chargeback_disputes_silver

models:
  - name: gold_fraud_features
    description: "Curated Gold behavioral fraud feature store for Gemini Enterprise Agent Platform and Looker"
    config:
      materialized: table
      cluster_by: ["customer_id", "loyalty_tier"]
    columns:
      - name: customer_id
        description: "Normalized customer identifier (CUST-XXXXXXX)"
        tests:
          - not_null
      - name: masked_ssn
        description: "64-character lowercase SHA-256 hash of cardholder SSN"
        tests:
          - not_null
      - name: masked_email
        description: "64-character lowercase SHA-256 hash of cardholder email"
        tests:
          - not_null
      - name: loyalty_tier
        description: "Customer loyalty tier coalesced to UNASSIGNED"
        tests:
          - not_null
      - name: payment_method
        description: "Payment method code (0=Credit, 1=Debit, 2=Wallet)"
        tests:
          - not_null
          - accepted_values:
              values: [0, 1, 2]
      - name: total_tx_count
        description: "Total settled transactions"
      - name: total_tx_amount
        description: "Gross transaction spend"
      - name: total_net_amount
        description: "Net spend after discounts"
      - name: avg_tx_amount
        description: "Average transaction spend"
      - name: high_risk_mcc_tx_count
        description: "Transactions at high-risk MCC merchants"
      - name: high_risk_mcc_amount
        description: "Spend at high-risk MCC merchants"
      - name: ato_mfa_tx_count
        description: "Transactions tied to high-risk auth/device events"
      - name: ato_mfa_tx_amount
        description: "Spend tied to high-risk auth/device events"
      - name: disputed_tx_count
        description: "Total disputed transactions"
      - name: total_disputed_amount
        description: "Total dispute dollar volume"
      - name: total_penalty_fee_usd
        description: "Total dispute penalties incurred"
      - name: peak_velocity_1h
        description: "Peak 1-hour transaction frequency"
      - name: max_geo_distance_km
        description: "Maximum distance from registered home"
      - name: high_velocity_risk_flag
        description: "High velocity or geo distance risk flag"
      - name: feature_refreshed_at
        description: "Feature materialization timestamp"
